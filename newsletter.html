<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Newsletter | Bena</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- NAVIGATION -->

    <nav>

        <div class="logo">

            <a href="index.html">

                <img src="images/Foto2.jpeg" alt="Bena Logo">

            </a>

        </div>

        <div class="nav-links">

            <a href="index.html">Start</a>

            <a href="about.html">Über uns</a>

        </div>

    </nav>

    <!-- NEWSLETTER -->

    <section class="newsletter-page">

        <div class="newsletter-box">

            <div class="newsletter-left">

                <p class="section-tag">

                    BENA NEWSLETTER

                </p>

                <h1>

                    Erhalte 5% auf Deine erste Bestellung

                </h1>

                <p class="newsletter-description">

                    Melde Dich jetzt für unseren Newsletter an und erhalte exklusive Angebote,
                    neue Produkte und spannende Einblicke hinter Bena.

                </p>

                <form class="newsletter-form">

                    <input type="text" placeholder="Vorname">

                    <input type="email" placeholder="E-Mail-Adresse">

                    <button type="submit">

                        Jetzt anmelden

                    </button>

                </form>

            </div>

            <div class="newsletter-right">

                <img src="images/Produktbild 6.png" alt="Newsletter Bena">

            </div>

        </div>

    </section>

</body>

</html>
